server:
  port: ${PORT:8080}

spring:
  data:
    web:
      pageable:
        serialization-mode: via-dto
        one-indexed-parameters: true
        max-page-size: 50

  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

  application:
    name: campustrack
    security:
      dev-open: ${SECURITY_DEV_OPEN:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    microservices:
      pdf-parser: ${PDF_PARSER_URL}
      sample: ${SAMPLE_SERVICE_URL:https://jsonplaceholder.typicode.com/}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    expiration: ${JWT_EXPIRATION:86400000}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
